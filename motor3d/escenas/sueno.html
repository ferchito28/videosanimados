    tomas: [[0, u => ({ pos: enCuarto(-2.4 + u * 0.2, 5, 8.5 - u * 0.4), mira: enCuarto(-2.0, 3.4, -3.5), fov: 44 })]],
    act: (u, d) => { acostado(1 - K.frena(cl((u / d) / 0.2))); ponerHora(3, 0); luzCiudad(1); },
    pj: [[enCama, (u, d) => ({ inclina: inclinaCama, cara: u / d < 0.5 ? 'sorpresa' : 'normal', zzz: false, brazos: u / d < 0.5 ? [60, 60] : [25, 25], codos: [100, 20] })]],
    over: (ctx, u, d) => K.letrero(ctx, '3:00 AM', 0.5, 0.17, u / 0.3, { tam: 180, color: '#ff5050' }),
  },
  { // 12. Tal vez no duermes mal... solo terminaste un ciclo.
    amb: ['cuarto'],
    tomas: [[0, (u, d) => { const k = K.suave((u / d - 0.5) / 0.4); return { pos: lerp(enCuarto(-2.2, 5, 8.5), enCuarto(-1.2, 5.6, 13), k), mira: lerp(enCuarto(-2, 3.4, -3.5), enCuarto(-1.2, 2.8, -3.5), k), fov: 46 }; }]],
    act: (u, d) => acostado(K.suave(cl((u / d - 0.55) / 0.3))),
    pj: [[enCama, (u, d) => ({ inclina: inclinaCama, cara: u / d < 0.75 ? 'feliz' : 'dormido', zzz: u / d > 0.8, brazos: [25, u / d < 0.55 ? 150 : 25], codos: [20, 25] })]],
    over: (ctx, u, d) => { K.letrero(ctx, 'CICLO', 0.42, 0.17, (u / d - 0.5) / 0.15, { tam: 180 }); palomita(ctx, 0.75, 0.17, (u / d - 0.6) / 0.15); },
  },
  { // 13. Eso sí: si te cuesta volver a dormir y amaneces agotado, vale la pena ir al médico.
    amb: ['dia'],
    tomas: [[0, u => ({ pos: [1, 4.2, clinicaZ + 18 - u * 0.8], mira: [5, 3.5, clinicaZ + 4], fov: 48 })],
            [(d) => d * 0.6, u => ({ pos: [1.5, 4.8, clinicaZ + 15 - u * 0.4], mira: [6.6, 4, clinicaZ + 1], fov: 46 })]],
    act: (u, d) => { luzCiudad(0); dormilonCalle.malla.position.z = clinicaZ + 9 - 6 * K.suave(u / d); },
    pj: [[dormilonCalle, (u, d) => ({ cara: u / d < 0.6 ? 'cansado' : 'feliz', camina: u / d < 0.85, brazos: [15, 15] })],
         [medico, (u, d) => ({ cara: 'feliz', habla: u / d > 0.6, brazos: [15, 140 + Math.sin(T * 8) * 20], codos: [10, 10] })]],
    over: (ctx, u, d) => palomita(ctx, 0.5, 0.17, (u / d - 0.8) / 0.15),
  },
];

// ===================================================== vida de fondo
function vida(n, u, dur, t) {
  const re = Math.round(t * 30) % 3 === 0;
  const ciudad = [0, 10, 13].includes(n), noche = n !== 13;
  genteCiudad.forEach((g, i) => { g.malla.visible = ciudad;
    if (ciudad) g.actualizar(t, camara, noche ? { cara: 'cansado', objeto: 'celular', brazos: [15, 60], codos: [10, 95] }
                                             : { cara: i % 2 ? 'feliz' : 'normal', objeto: null, camina: true, brazos: [15, 15] }, re); });
  avesCiudad(t, n === 13);
  humosP.forEach(h => h(t, n >= 7 && n <= 9));
  if (n >= 7 && n <= 9) extrasPueblo.forEach((e, i) => e.actualizar(t, camara, { cara: n === 8 ? 'feliz' : 'dormido', objeto: i % 3 === 0 ? 'vela' : null, habla: n === 8 && i % 2 === 0, brazos: [15, i % 3 === 0 ? 70 : 15], codos: [10, 60] }, re));
  raros.forEach((m, i) => { m.rotation.y = t * (0.5 + (i % 3) * 0.3); m.position.y += Math.sin(t * 2 + i) * 0.01; });
  carteles.forEach(c => (c.visible = n >= 2 && n <= 6));
}

// ===================================================== estilo realista
// velita en el buró y luces cálidas
const vela = new THREE.Group(); vela.position.set(3.2, 2.4, -4.4); cuarto.add(vela);
vela.add(K.malla(new THREE.CylinderGeometry(0.35, 0.4, 0.12, 16), K.toon(0xc9a24a), 0, 0.06, 0));
vela.add(K.malla(new THREE.CylinderGeometry(0.12, 0.12, 0.8, 12), K.toon(0xfff6dc), 0, 0.5, 0));
const llama = K.malla(new THREE.SphereGeometry(0.11, 10, 8), K.toon(0xffc040, { emissive: 0xffa020, emissiveIntensity: 3 }), 0, 1.05, 0, false);
llama.scale.y = 1.8; vela.add(llama);
const luzLampara = new THREE.PointLight(0xffb060, 40, 22, 1.6); luzLampara.position.set(4.8, 4.6, -5.0); cuarto.add(luzLampara);
const luzVela = new THREE.PointLight(0xff9a40, 8, 8, 1.8); luzVela.position.set(3.2, 3.6, -4.0); cuarto.add(luzVela);
const lucesPueblo = [-20, 0, 20].map(x => { const l = new THREE.PointLight(0xffa850, 0, 26, 1.5); l.position.set(XP + x, 4.4, 0); escena.add(l); return l; });
const lucesCiudad = [0, -14, -28].map(z => { const l = new THREE.PointLight(0xffd080, 0, 24, 1.5); l.position.set(0, 6, z); escena.add(l); return l; });
R.convertir(escena);
R.neblina(escena, 0x1b2348, 0.01);
const nieve = R.particulas(escena, 500, 0xffffff, 0.16);
const polvito = R.particulas(escena, 260, 0xffd9a0, 0.08);
const chispas = R.particulas(escena, 320, 0xffc8ff, 0.22);
const NIEBLA = { noche: [0x1b2348, 0.011], cuarto: [0x2a1d30, 0.0], sueno: [0x5a3a8a, 0.006], dia: [0xc8dcf0, 0.004] };
function atmosfera(amb, t, tm) {
  const [c, d] = NIEBLA[amb] || NIEBLA.noche;
  escena.fog.color.set(c); escena.fog.density = d;
  r.gl.toneMappingExposure = amb === 'noche' ? 1.35 : amb === 'cuarto' ? 1.15 : 1.05;
  const foco = camara.position.distanceTo(new THREE.Vector3(...tm.mira));
  R.enfocar(r, foco, amb === 'cuarto' ? 1.4 : 1);
  nieve(t, camara, amb === 'noche', 0.5);
  polvito(t, camara, amb === 'cuarto', 0.15);
  chispas(t, camara, amb === 'sueno', 0.25);
  llama.scale.set(1 + Math.sin(t * 23) * 0.15, 1.8 + Math.sin(t * 17) * 0.3, 1);
  luzVela.intensity = 8 + Math.sin(t * 19) * 1.5;
  const encendidoCiudad = focoMat.emissive.r;
  lucesCiudad.forEach(l => (l.intensity = 30 * encendidoCiudad));
  const velasK = velaMat.emissive.r / 0.82;
  lucesPueblo.forEach(l => (l.intensity = 12 + 30 * velasK));
}

// ===================================================== cada cuadro
const P_DE = n => ({ w: k => datos.frases[n].palabras[k] });
window.cuadro = (t) => {
  T = t;
  let n = 0;
  while (n + 1 < datos.frases.length && t >= datos.frases[n + 1].ini) n++;
  temblor = 0; destello = 0;
  for (let i = 0; i <= n; i++) {
    const F = FRASES[i], ini = datos.frases[i].ini, dur = datos.frases[i].fin - ini;
    const u = i < n ? dur : t - ini;
    if (F.act) F.act(u, dur, P_DE(i));
    if (i < n && F.fin) F.fin();
  }
  const F = FRASES[n], ini = datos.frases[n].ini, dur = datos.frases[n].fin - ini, u = t - ini, P = P_DE(n);
  let ti = 0;
  const inicioToma = j => (typeof F.tomas[j][0] === 'function' ? F.tomas[j][0](dur, P) : F.tomas[j][0]);
  while (ti + 1 < F.tomas.length && u >= inicioToma(ti + 1)) ti++;
  const ut = u - inicioToma(ti);
  const tm = F.tomas[ti][1](ut, dur, P);
  const enCuartoAhora = tm.mira[0] < -200;
  const amb = enCuartoAhora ? 'cuarto' : F.amb[0];
  K.ambiente(mundo, amb);
  const deNoche = amb !== 'dia';
  solG.visible = !deNoche; nubes.forEach(c => (c.visible = !deNoche)); nocheG.visible = deNoche;
  luna.position.set(camara.position.x + 250, 220, -800);
  PASTO.color.set(amb === 'dia' ? 0x5f9a4a : amb === 'sueno' ? 0x6a5ab0 : 0x2f4a3a);
  const pos = tm.pos.toArray ? tm.pos.toArray() : tm.pos;
  atmosfera(amb, t, tm);
  const sacude = temblor * 0.35;
  camara.position.set(pos[0] + Math.sin(t * 91) * sacude, pos[1] + Math.sin(t * 77) * sacude, pos[2]);
  camara.lookAt(...tm.mira);
  camara.fov = tm.fov * (1 + 0.08 * (1 - K.frena(ut / 0.25)));
  camara.updateProjectionMatrix();
  luz.target.position.set(tm.mira[0], 0, tm.mira[2]);
  luz.position.copy(luz.target.position).add(luz.userData.offset);
  luz.target.updateMatrixWorld();
  vida(n, u, dur, t);
  (F.pj || []).forEach(([pj, est]) => pj.actualizar(t, camara, est(u, dur, P)));
  // el dormilón acostado no debe girar hacia la cámara
  if (dormilon.malla.visible) dormilon.malla.rotation.y = 0;
  r.efecto.render(escena, camara);
  r.ctx.drawImage(r.gl.domElement, 0, 0);
  if (F.over) F.over(r.ctx, u, dur, P);
  K.destello(r.ctx, destello);
  K.subtitulos(r.ctx, datos.subs, t);
  return r.salida.toDataURL('image/jpeg', 0.9);
};
window.listo = Promise.resolve();
