    over: (ctx, u, d, P) => { if (u < W(P, 6)) K.letrero(ctx, 'TORMENTA', 0.5, 0.16, (u - W(P, 3)) / 0.25, { tam: 170, color: '#ffffff', giro: 0 }); },
  },
  { // 2. El vecino se ríe: ¿Qué, vas a cocinar la banqueta?
    amb: 'noche',
    tomas: [[0, u => ({ pos: [6.4 + u * 0.15, 4.2, 4.2 - u * 0.2], mira: [12.4, 3.0, -1.2], fov: 46 })]],
    pj: [[vecino, (u) => ({ cara: 'feliz', habla: true, objeto: 'taza', brazos: [70 + Math.sin(T * 9) * 12, 60], codos: [80, 70], tiembla: 0.3 })]],
    over: (ctx, u, d) => K.letrero(ctx, 'JAJAJA', 0.5, 0.17, (u - 0.15) / 0.25, { tam: 180, color: '#ffffff' }),
  },
  { // 3. A la mañana siguiente, todo está congelado.
    amb: 'invierno',
    tomas: [[0, u => ({ pos: [3, 7.5 - u * 0.5, 24 - u * 2], mira: [1, 1.5, -6], fov: 50 })],
            [(d) => d * 0.55, u => ({ pos: [5.2 - u * 0.3, 1.3, 6], mira: [3.2, 0.2, -3], fov: 46 })]],
    act: () => { colonia('manana'); vecino.malla.visible = false; },
    over: (ctx, u, d) => K.letrero(ctx, '¡TODO HIELO!', 0.5, 0.17, (u / d - 0.55) / 0.15, { tam: 170, color: '#9fdcff' }),
  },
  { // 4. El vecino arranca su camioneta, acelera… y se va patinando hasta el bote de basura.
    amb: 'invierno',
    tomas: [[0, u => ({ pos: [1.6 + u * 0.2, 3.6, -0.6], mira: [9.8, 2.0, 3.4], fov: 46 })],
            [(d, P) => W(P, 8) - 0.05, (u, d) => { const p = troca.position; return { pos: [-6, 9.5, 11 - u * 1.5], mira: [p.x - 1, 1, p.z - 1], fov: 50 }; }],
            [(d, P) => W(P, 12) - 0.15, u => ({ pos: [3.4, 4.2, -24 + u * 0.3], mira: [7.2, 1.4, -13.6], fov: 48 })]],
    act: (u, d, P) => {
      const arranca = cl((u - W(P, 5)) / Math.max(0.3, W(P, 8) - W(P, 5))), patina = cl((u - W(P, 8)) / Math.max(0.5, W(P, 13) - W(P, 8)));
      trocaRuta(patina);
      troca.userData.ruedas.forEach(rr => (rr.children[0].rotation.x = u * (arranca > 0 ? 40 : 0)));
      if (patina <= 0 && arranca > 0) troca.position.x += Math.sin(T * 60) * 0.05;
      const choque = (u - W(P, 13)) / 1.0;
      ponerBotes(choque);
      golpeBasura(choque);
      temblor = choque > 0 && choque < 0.4 ? 1 - choque / 0.4 : 0;
      destello = choque > 0 && choque < 0.15 ? 0.5 : 0;
    },
    fin: () => { trocaRuta(1); ponerBotes(1); golpeBasura(2); },
    pj: [[vecinoManeja, (u, d, P) => ({ cara: u < W(P, 5) ? 'feliz' : u < W(P, 13) ? 'miedo' : 'mareado', brazos: [u < W(P, 8) ? 60 : 150, u < W(P, 8) ? 60 : 150], codos: [60, 60], tiembla: u > W(P, 8) ? 1 : 0 })],
         ...mirones.map((m, i) => [m, (u, d, P) => ({ cara: u > W(P, 13) ? (i ? 'feliz' : 'sorpresa') : 'normal', brazos: [15, u > W(P, 13) ? 150 : 15], codos: [10, 20] })])],
    over: (ctx, u, d, P) => { if (u > W(P, 5) && u < W(P, 8)) K.letrero(ctx, 'VRUUUM', 0.5, 0.17, (u - W(P, 5)) / 0.2, { tam: 160, color: '#ffffff' });
      K.letrero(ctx, '¡CRASH!', 0.5, 0.17, (u - W(P, 13)) / 0.15, { tam: 210 }); },
  },
  { // 5. Mientras, Beto sale tranquilo, sin resbalarse ni una vez.
    amb: 'invierno',
    tomas: [[0, u => { const b = beto.malla.position; return { pos: [b.x + 4.6, 4.0, 8.6], mira: [b.x + 0.4, 2.4, b.z], fov: 48 }; }]],
    act: (u, d) => { beto.malla.position.set(-13 + 6.5 * K.suave(u / d), 0, 0.6 + K.suave(u / d) * 0.6); },
    fin: () => beto.malla.position.set(-6.5, 0, 1.2),
    pj: [[beto, (u, d) => ({ cara: 'feliz', objeto: 'taza', camina: u / d < 0.92, brazos: [15, 70], codos: [10, 80] })]],
    over: (ctx, u, d) => palomita(ctx, 0.5, 0.17, (u / d - 0.75) / 0.12),
  },
  { // 6. ¿Por qué?
    amb: 'invierno',
    tomas: [[0, u => ({ pos: [0.2, 3.4 - u * 0.8, 6.8 - u * 1.2], mira: [0, 0, -1.5], fov: 50 })]],
    over: (ctx, u, d) => K.letrero(ctx, '¿POR QUÉ?', 0.5, 0.17, u / 0.15, { tam: 220 }),
  },
  { // 7. El agua se congela a cero grados, cuando sus moléculas se agarran de la mano y forman hielo.
    amb: 'lab',
    tomas: [[0, u => ({ pos: enLab(13.5, 3.8, 8.5 - u * 0.3), mira: enLab(13.5, 3.6, 0), fov: 46 })],
            [(d, P) => W(P, 7) - 0.05, u => ({ pos: enLab(0, CY, 20 - u * 0.4), mira: enLab(0, CY - 0.2, 0), fov: 50 })]],
    act: (u, d, P) => { termoLab(10 - 10 * K.suave(u / Math.max(0.5, W(P, 6))));
      estadoMol = { junta: K.suave((u - W(P, 10)) / Math.max(0.4, W(P, 16) - W(P, 10))), sal: 0 }; },
    fin: () => { estadoMol = { junta: 1, sal: 0 }; termoLab(0); },
    over: (ctx, u, d, P) => { if (u < W(P, 7)) K.letrero(ctx, '0 °C', 0.5, 0.15, (u - W(P, 5)) / 0.2, { tam: 200, color: '#9fdcff' });
      else K.letrero(ctx, 'HIELO', 0.5, 0.15, (u - W(P, 16)) / 0.2, { tam: 200, color: '#9fdcff' }); },
  },
  { // 8. Pero la sal se mete en medio y no las deja agarrarse.
    amb: 'lab',
    tomas: [[0, u => ({ pos: enLab(0.3, CY + 0.3, 18.5 - u * 0.5), mira: enLab(0, CY - 0.2, 0), fov: 50 })]],
    act: (u, d, P) => { estadoMol = { junta: 1, sal: K.suave((u - W(P, 2)) / Math.max(0.6, d * 0.6)) }; },
    fin: () => { estadoMol = { junta: 1, sal: 1 }; },
    over: (ctx, u, d, P) => K.letrero(ctx, '¡SUÉLTENSE!', 0.5, 0.15, (u / d - 0.55) / 0.15, { tam: 170, color: '#ffffff' }),
  },
  { // 9. Con sal, el agua aguanta hasta unos nueve grados bajo cero sin congelarse.
    amb: 'lab',
    tomas: [[0, u => ({ pos: enLab(14.6 - u * 0.2, 4.0, 10.5 - u * 0.3), mira: enLab(14.6, 3.4, 0), fov: 46 })]],
    act: (u, d, P) => { termoLab(-9 * K.suave((u - W(P, 5)) / Math.max(0.6, W(P, 10) - W(P, 5))));
      agua.scale.y = 1 + Math.sin(T * 6) * 0.015; agua.rotation.y = T; },
    fin: () => termoLab(-9),
    over: (ctx, u, d, P) => { K.letrero(ctx, '-9 °C', 0.5, 0.15, (u - W(P, 9)) / 0.2, { tam: 210 });
      if (u > W(P, 12)) palomita(ctx, 0.8, 0.15, (u - W(P, 12)) / 0.2); },
  },
  { // 10. Por eso las ciudades rocían agua con sal antes de la tormenta: así el hielo no se pega al piso.
    amb: 'invierno',
    tomas: [[0, (u, d) => { const p = pipa.position; return { pos: [p.x + 8, 4.2, p.z + 9], mira: [p.x, 1.4, p.z + 1], fov: 50 }; }],
            [(d, P) => W(P, 12) - 0.1, (u) => { const p = quita.position; return { pos: [p.x - 8.5, 4.5, p.z + 8.5], mira: [p.x, 1.2, p.z + 1.5], fov: 50 }; }]],
    tormenta2: true,
    act: (u, d, P) => {
      const zp = 30 - u * 7; pipa.position.set(XC, 0, zp); pipa.visible = u < W(P, 12); rayasHasta(34.4, zp + 4.4);
      chorros.forEach(([m, k, a]) => { const q = (T * 3 + a) % 1; m.visible = u < W(P, 12); m.position.set(XC + (k - 1) * 2.5 + (a - 0.5) * 0.4, 0.5 - q * 0.4, zp + 4.4 + q * 0.6); });
      const zq = 26 - Math.max(0, u - W(P, 12)) * 6; quita.position.set(XC + 0.5, 0, zq); quita.visible = u > W(P, 12) - 0.1;
      const verNieve = u > W(P, 12) - 0.1;
      capaNieve.visible = verNieve; capaNieve.scale.z = 140; capaNieve.position.set(XC, 0.2, zq - 3.5 - 70);
      montonPala.forEach((b, i) => { b.visible = verNieve; b.position.set(XC + 0.5 - 1.6 + (i % 3) * 1.3 + Math.sin(T * 8 + i) * 0.1, 0.4 + Math.floor(i / 3) * 0.45, zq - 3.9 - (i % 3) * 0.45); });
    },
    fin: () => { chorros.forEach(([m]) => (m.visible = false)); },
    over: (ctx, u, d, P) => { if (u < W(P, 12)) K.letrero(ctx, 'ANTES', 0.5, 0.15, (u - W(P, 8)) / 0.2, { tam: 200 });
      else palomita(ctx, 0.5, 0.15, (u - W(P, 17)) / 0.2); },
  },
  { // 11. Al otro día, el vecino compró diez bultos de sal.
    amb: 'invierno',
    tomas: [[0, u => ({ pos: [5.4 - u * 0.2, 4.6, 4.4 - u * 0.3], mira: [10.4, 2.0, -3.8], fov: 50 })]],
    act: (u, d, P) => { bultos.visible = true; bultos.children.forEach((b, i) => (b.visible = u > W(P, 5) + i * 0.09)); vecino.malla.position.set(11.8, 0, -3.0); vecino.malla.visible = true; },
    pj: [[vecino, (u, d) => ({ cara: 'feliz', objeto: 'sal', brazos: [150, 60], codos: [10, 60], salto: Math.abs(Math.sin(T * 7)) * 20 })]],
    over: (ctx, u, d, P) => K.letrero(ctx, 'x10', 0.5, 0.15, (u - W(P, 6)) / 0.2, { tam: 230 }),
  },
  { // 12. Pero esa noche bajó a quince bajo cero.
    amb: 'noche',
    tomas: [[0, u => ({ pos: [8.6, 3.2, 0.2 - u * 0.4], mira: [9.3, 2.9, -6.6], fov: 46 })]],
    act: (u, d) => { colonia('frio'); termoPorche(-4 - 11 * K.suave(u / (d * 0.75))); },
    fin: () => termoPorche(-15),
    over: (ctx, u, d) => K.letrero(ctx, '-15 °C', 0.5, 0.15, (u / d - 0.5) / 0.15, { tam: 220, color: '#9fdcff' }),
  },
  { // 13. Y ahí la sal ya no sirve: se usa arena.
    amb: 'noche',
    tomas: [[0, u => ({ pos: [6.8, 3.6, 3.0 - u * 0.2], mira: [11.2, 1.8, -2.6], fov: 48 })],
            [(d, P) => W(P, 7) - 0.05, u => ({ pos: [-4.4 - u * 0.2, 3.8, 7.8], mira: [-9.0, 2.0, 0.8], fov: 48 })]],
    act: (u, d, P) => {
      vecino.malla.position.set(11.8, 0, -1.2); beto.malla.position.set(-9.6, 0, 1.0);
      if (u < W(P, 7)) lanzar(cl(u / Math.max(0.5, W(P, 6))), [11.2, 2.6, -1.2], [10.5, 0, 1.5], 0xffffff);
      else { const p = cl((u - W(P, 8)) / Math.max(0.4, d - W(P, 8))); lanzar(p > 0 && p < 1 ? p : 0, MANO_BETO, [-6, 0, 0.5], 0xa0743a); arenaK = p; }
    },
    fin: () => { lanzar(0, MANO_BETO, [0, 0, 0], 0); arenaK = 1; },
    pj: [[vecino, (u, d, P) => ({ cara: u > W(P, 3) ? 'preocupado' : 'normal', objeto: 'sal', brazos: [90 + Math.sin(T * 14) * 30, 60], codos: [10, 60] })],
         [beto, (u, d, P) => ({ cara: 'feliz', objeto: 'arena', brazos: [u > W(P, 8) ? 90 + Math.sin(T * 14) * 40 : 15, 60], codos: [10, 60] })]],
    over: (ctx, u, d, P) => { if (u < W(P, 7)) palomita(ctx, 0.5, 0.15, (u - W(P, 4)) / 0.15, false);
      else K.letrero(ctx, 'ARENA', 0.5, 0.15, (u - W(P, 8)) / 0.2, { tam: 210 }); },
  },
  { // 14. Beto ya tenía arena.
    amb: 'noche',
    tomas: [[0, u => ({ pos: [-6.0, 3.6, 13.5 - u * 0.4], mira: [-6.1, 2.4, 1.5], fov: 48 })]],
    act: (u, d) => { const p = cl((u / d - 0.35) / 0.3);
      vecino.malla.position.set(-5.0 + p * 0.5, 0, 2.4); beto.malla.position.set(-7.8, 0, 1.4); vecino.malla.rotation.set(0, 0, -K.acelera(p) * 1.4);
      temblor = p >= 1 && u / d < 0.8 ? 0.6 : 0; },
    fin: () => vecino.malla.rotation.set(0, 0, 0),
    pj: [[beto, () => ({ cara: 'feliz', objeto: 'arena', brazos: [150, 60], codos: [10, 60] })],
         [vecino, (u, d) => ({ cara: u / d > 0.55 ? 'mareado' : 'sorpresa', objeto: 'sal', brazos: [140, 140], codos: [30, 30] })]],
    over: (ctx, u, d) => { K.letrero(ctx, '¡PUM!', 0.62, 0.15, (u / d - 0.62) / 0.12, { tam: 190 }); palomita(ctx, 0.3, 0.15, (u / d - 0.3) / 0.12); },
  },
];

// ===================================================== vida de fondo y clima
function vida(n, u, dur, t) {
  const re = Math.round(t * 30) % 3 === 0;
  const enColonia = !(n >= 7 && n <= 10);
  gente.forEach((g, i) => { g.malla.visible = enColonia;
    if (enColonia) g.actualizar(t, camara, { cara: i < 2 ? 'feliz' : (i % 3 ? 'normal' : 'frio'), camina: i >= 4 && i % 2 === 0, brazos: i < 2 ? [120 + Math.sin(t * 6 + i) * 30, 30] : [15, 15], codos: [10, 10], salto: i < 2 ? Math.abs(Math.sin(t * 5 + i)) * 25 : 0 }, re); });
  gente.forEach((g, i) => { if (i >= 4 && i % 2 === 0) g.malla.position.z += Math.sin(t * 0.3 + i) * 0.01; });
  mirones.forEach(m => (m.malla.visible = enColonia && n >= 4));
  humos.forEach(h => h(t, enColonia));
  humoEscape(t, n === 4);
  lucesNav.forEach((m, i) => { m.emissive.set(COLORES_LUZ[i]).multiplyScalar(momento === 'manana' ? 0.15 : Math.sin(t * 3 + i * 1.7) > 0 ? 1 : 0.35); });
}
function estadoColonia() {
  const noche = momento !== 'manana';
  ventMat.color.set(noche ? 0xffe39a : 0x9fc0dc); ventMat.emissive.set(noche ? 0xc89a30 : 0x000000);
  focoMat.emissive.set(noche ? 0xffc840 : 0x000000); focoMat.color.set(noche ? 0xfff2a0 : 0x9a9a90);
  nieveCalle.visible = momento === 'noche';
  hielo.visible = momento !== 'noche';
  zonaBeto.visible = momento !== 'noche';
  salSuelo.count = Math.round(700 * salK);
  arenaSuelo.count = Math.round(900 * arenaK);
  arenaTinte.forEach(m => (m.material.opacity = 0.85 * arenaK));
  carambanos.forEach(c => (c.visible = momento !== 'noche'));
  troca.userData.nieve.forEach(m => (m.visible = momento !== 'manana' || troca.position.x > 9));
}

// ===================================================== estilo realista
const lucesCalle = [[-5.4, 5, 0], [5.4, 5, -6], [-5.4, 5, -18], [5.4, 5, 14]].map(([x, y, z]) => { const l = new THREE.PointLight(0xffc070, 0, 26, 1.4); l.position.set(x, y, z); escena.add(l); return l; });
const luzPorche = new THREE.PointLight(0xffb060, 0, 14, 1.6); luzPorche.position.set(9.5, 4.2, -5); escena.add(luzPorche);
const luzLab = new THREE.PointLight(0xb0d8ff, 30, 40, 1.2); luzLab.position.set(XL, 12, 10); escena.add(luzLab);
R.convertir(escena);
R.neblina(escena, 0x1b2348, 0.012);
const nieve = R.particulas(escena, 650, 0xffffff, 0.16);
const nieveFuerte = R.particulas(escena, 900, 0xffffff, 0.2);
const brillitos = R.particulas(escena, 200, 0xbfe6ff, 0.1);
const NIEBLA = { noche: [0x1b2348, 0.012], invierno: [0xdde8f4, 0.006], lab: [0x14203c, 0.0] };
function atmosfera(amb, F, t, tm) {
  const [c, d] = NIEBLA[amb];
  escena.fog.color.set(c); escena.fog.density = d;
  r.gl.toneMappingExposure = amb === 'noche' ? 1.3 : amb === 'lab' ? 1.15 : 1.0;
  R.enfocar(r, camara.position.distanceTo(new THREE.Vector3(...tm.mira)), 1);
  nieve(t, camara, amb === 'noche' && !F.tormenta, 0.6);
  nieveFuerte(t, camara, !!F.tormenta || (!!F.tormenta2 && quita.visible), 1.6);
  brillitos(t, camara, amb === 'invierno', 0.1);
  const noche = amb === 'noche';
  lucesCalle.forEach(l => (l.intensity = noche ? 34 : 0));
  luzPorche.intensity = noche ? 5 : 0;
  luzLab.intensity = amb === 'lab' ? 30 : 0;
}

// ===================================================== cada cuadro
const P_DE = n => ({ w: k => datos.frases[n].palabras[k] });
window.cuadro = (t) => {
  T = t;
  let n = 0;
  while (n + 1 < datos.frases.length && t >= datos.frases[n + 1].ini) n++;
  temblor = 0; destello = 0;
  for (let i = 0; i <= n; i++) {
    const F = FRASES[i], ini = datos.frases[i].ini, dur = datos.frases[i].fin - ini;
    const u = i < n ? dur : t - ini;
    if (F.act) F.act(u, dur, P_DE(i));
    if (i < n && F.fin) F.fin();
    if (i < n) { temblor = 0; destello = 0; }
  }
  const F = FRASES[n], ini = datos.frases[n].ini, dur = datos.frases[n].fin - ini, u = t - ini, P = P_DE(n);
  let ti = 0;
  const inicioToma = j => (typeof F.tomas[j][0] === 'function' ? F.tomas[j][0](dur, P) : F.tomas[j][0]);
  while (ti + 1 < F.tomas.length && u >= inicioToma(ti + 1)) ti++;
  const ut = u - inicioToma(ti);
  const tm = F.tomas[ti][1](ut, dur, P);
  const amb = F.amb;
  K.ambiente(mundo, amb);
  nocheG.visible = amb === 'noche'; nubes.forEach(c => (c.visible = amb === 'invierno'));
  luna.position.set(camara.position.x + 250, 220, -800);
  estadoColonia();
  const pos = tm.pos.toArray ? tm.pos.toArray() : tm.pos;
  atmosfera(amb, F, t, { ...tm, pos });
  const sacude = temblor * 0.35;
  camara.position.set(pos[0] + Math.sin(t * 91) * sacude, pos[1] + Math.sin(t * 77) * sacude, pos[2]);
  camara.lookAt(...tm.mira);
  camara.fov = tm.fov * (1 + 0.08 * (1 - K.frena(ut / 0.25)));
  camara.updateProjectionMatrix();
  luz.target.position.set(tm.mira[0], 0, tm.mira[2]);
  luz.position.copy(luz.target.position).add(luz.userData.offset);
  luz.target.updateMatrixWorld();
  ponerMoleculas(t);
  vida(n, u, dur, t);
  (F.pj || []).forEach(([pj, est]) => pj.actualizar(t, camara, est(u, dur, P)));
  if (n !== 14) vecino.malla.rotation.z = 0;
  r.efecto.render(escena, camara);
  r.ctx.drawImage(r.gl.domElement, 0, 0);
  if (F.over) F.over(r.ctx, u, dur, P);
  K.destello(r.ctx, destello);
  K.subtitulos(r.ctx, datos.subs, t);
  return r.salida.toDataURL('image/jpeg', 0.9);
};
window.listo = Promise.resolve();
