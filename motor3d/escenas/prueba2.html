<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Prueba 3D v2</title>
<script type="importmap">
{ "imports": {
    "three": "/motor3d/node_modules/three/build/three.module.js",
    "three/addons/": "/motor3d/node_modules/three/examples/jsm/"
} }
</script>
<style>body{margin:0;background:#000}</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import * as K from '/motor3d/kit.js';
import { Personaje2D } from '/motor3d/personaje2d.js';

window.DURACION = 6.4;
const r = K.crearRender();
const { escena, camara } = r;

K.cielo(escena, '#3f96ea', '#ffe0b0');
K.luces(escena, [35, 55, 25]);
K.sol(escena, 160, 190, -700, 40);
K.nube(escena, -90, 110, -500, 2.2);
K.nube(escena, 160, 140, -650, 2.8);
K.nube(escena, 30, 170, -800, 2);
K.desierto(escena);

// ---- pueblo
const colores = [0xe9b96e, 0xd98b5f, 0x9ec7a8, 0xf0d08a, 0xc9a2d6, 0x8fb7e0];
for (let i = 0; i < 9; i++) {
  K.casa(escena, -18 - (i % 3) * 11, -20 - i * 13, 7 + (i % 3) * 2, 5 + (i % 4) * 3, 7, colores[i % colores.length]);
}
K.tanqueAgua(escena, -36, -75);
for (let z = 10; z > -200; z -= 24) K.poste(escena, 16, z);

// ---- carretera de concreto con juntas
const ANCHO_C = 9, LARGO = 420, Z0 = 20;
escena.add(K.malla(new THREE.BoxGeometry(ANCHO_C, 0.3, LARGO), K.toon(0xc9c8c2), 0, 0.15, Z0 - LARGO / 2));
const orilla = K.toon(0x8f8e88);
[-1, 1].forEach(l => escena.add(K.malla(new THREE.BoxGeometry(0.5, 0.36, LARGO), orilla, l * (ANCHO_C / 2 + 0.2), 0.18, Z0 - LARGO / 2)));
const matJunta = K.sinContorno(new THREE.MeshToonMaterial({ color: 0x4a4946, emissive: 0x000000 }));
for (let z = Z0 - 4.5; z > Z0 - LARGO; z -= 4.5)
  escena.add(K.malla(new THREE.BoxGeometry(ANCHO_C, 0.06, 0.16), matJunta, 0, 0.31, z, false));
escena.add(K.malla(new THREE.BoxGeometry(0.1, 0.06, LARGO), matJunta, 0, 0.31, Z0 - LARGO / 2, false));

// ---- obra: mezcladora, vallas, conos
const mezc = K.mezcladora(escena, 12.5, -16, -0.35);
K.valla(escena, 6.2, -2, 0.1);
K.valla(escena, 6.2, -24, -0.1);
const naranja = K.toon(0xff7a1a), blanco = K.toon(0xffffff);
for (let i = 0; i < 8; i++) {
  const c = new THREE.Group();
  c.add(K.malla(new THREE.ConeGeometry(0.45, 1.3, 16), naranja, 0, 0.75, 0));
  c.add(K.malla(new THREE.CylinderGeometry(0.29, 0.34, 0.22, 16), blanco, 0, 0.78, 0));
  c.add(K.malla(new THREE.BoxGeometry(1.0, 0.12, 1.0), naranja, 0, 0.06, 0));
  c.position.set(ANCHO_C / 2 + 1.0, 0, 6 - i * 7);
  escena.add(c);
}

// ---- personajes
const obrero = new Personaje2D('obrero', 4.6).agregar(escena, 7.2, -8);
const jefe = new Personaje2D('jefe', 5.2).agregar(escena, 10.2, -10);

const SUBS = [
  [0.1, '¿POR QUÉ'], [0.7, 'LAS CARRETERAS'], [1.65, 'DE CONCRETO'], [2.35, 'TIENEN ESTAS'],
  [3.25, 'RAYAS?', true], [4.3, ''],
];

// tomas: [inicio, función(u) → {pos, mira, fov}]
const TOMAS = [
  [0.0, u => ({ pos: K.recorrido([[0, [-40, 30, 40]], [1.6, [-12, 12, 14]]], u), mira: [2, 6, -30], fov: 45 })],
  [1.6, u => ({ pos: [obrero.malla.position.x - 3.2 + u * 0.4, 3.0, obrero.malla.position.z + 9.5 - u * 1.1],
                mira: [obrero.malla.position.x + 0.8, 2.9, obrero.malla.position.z], fov: 40 })],
  [3.2, u => ({ pos: [-2.5 + u * 0.8, 0.9, 6 - u * 2.5], mira: [1.5, 0.2, -30], fov: 50 })],
  [4.6, u => {
    const a = -0.5 + u * 0.35, cx = 8.7, cz = -9;
    return { pos: [cx + Math.sin(a) * 11, 3.4, cz + Math.cos(a) * 11], mira: [cx, 2.8, cz], fov: 42 };
  }],
];

window.cuadro = (t) => {
  let i = 0;
  while (i + 1 < TOMAS.length && t >= TOMAS[i + 1][0]) i++;
  const u = t - TOMAS[i][0];
  const toma = TOMAS[i][1](u);
  const golpe = 1 - K.frena(u / 0.25);          // pequeño empujón al cambiar de toma
  camara.position.set(...(toma.pos.toArray ? toma.pos.toArray() : toma.pos));
  camara.lookAt(...toma.mira);
  camara.fov = toma.fov * (1 + 0.08 * golpe);
  camara.updateProjectionMatrix();

  const brillo = K.suave((t - 3.25) / 0.3) * (0.6 + 0.4 * Math.sin(t * 12));
  matJunta.color.set(0x4a4946).lerp(new THREE.Color(0xffd600), brillo);
  matJunta.emissive.set(0x000000).lerp(new THREE.Color(0xc0a000), brillo);
  mezc.userData.tambor.rotation.y = t * 2;

  obrero.actualizar(t, camara, {
    habla: t > 1.6 && t < 3.2,
    cara: t < 4.6 ? 'normal' : 'feliz',
    brazos: t > 1.6 && t < 3.2 ? [15, 60 + Math.sin(t * 6) * 15] : (t >= 4.6 ? [15, 150 + Math.sin(t * 14) * 15] : [15, 15]),
    codos: [10, t >= 4.6 ? 10 : 50],
  });
  jefe.actualizar(t, camara, {
    cara: t < 4.6 ? 'normal' : 'sorpresa',
    brazos: t >= 4.6 ? [70, 70] : [15, 15],
    codos: [60, 60],
    salto: t >= 4.6 ? 30 * Math.max(0, Math.sin(Math.min(1, (t - 4.6) / 0.35) * Math.PI)) : 0,
  });
  return K.componer(r, SUBS, t);
};

window.listo = K.cargarFuente();
</script>
</body>
</html>
